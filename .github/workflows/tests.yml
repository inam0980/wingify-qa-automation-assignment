name: Dream Portal Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # The site under test is live, so a nightly run catches it changing underneath us.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      browser:
        description: Browser to run against
        type: choice
        options: [chrome, edge, firefox]
        default: chrome
      ai_provider:
        description: AI provider for the Part 2 tests
        type: choice
        options: [rule, gemini, groq, openai]
        default: rule

jobs:
  test:
    name: Selenium suite (${{ github.event.inputs.browser || 'chrome' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run the test suite
        env:
          BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
          HEADLESS: "true"
          # With no secret configured these stay empty and the suite falls back to the local
          # rule-based classifier, so a fork with no keys still gets a meaningful run.
          AI_PROVIDER: ${{ github.event.inputs.ai_provider || vars.AI_PROVIDER || 'rule' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: mvn -B clean test

      - name: Upload the HTML report
        # Always: a failed run is exactly when the report is worth reading.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/reports/
          retention-days: 30

      - name: Upload the Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 30

      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-logs
          path: |
            target/screenshots/
            target/logs/
          retention-days: 30

      - name: Summarise the run
        if: always()
        run: |
          echo "### Dream Portal test run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Browser | ${BROWSER:-chrome} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AI provider | ${AI_PROVIDER:-rule} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reports are attached to this run as artifacts." >> "$GITHUB_STEP_SUMMARY"
        env:
          BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
          AI_PROVIDER: ${{ github.event.inputs.ai_provider || vars.AI_PROVIDER || 'rule' }}
