# ---------------------------------------------------------------------------
# Dream Portal automation - default configuration
#
# Every key here can be overridden without editing this file:
#   -Dbrowser=edge            JVM system property  (highest precedence)
#   BROWSER=edge              environment variable
#   BROWSER=edge in .env      untracked file at the project root
# ---------------------------------------------------------------------------

# --- Application under test -------------------------------------------------
base.url=https://arjitnigam.github.io/myDreams/

# --- Browser ----------------------------------------------------------------
# chrome | edge | firefox. Drivers are resolved automatically by Selenium Manager.
browser=chrome
headless=true

# --- Waits ------------------------------------------------------------------
explicit.wait.seconds=15
page.load.timeout.seconds=30

# The portal's script.js hides the spinner via setTimeout(..., 3000).
# The tolerance absorbs page-load and rendering jitter without making the check meaningless.
loading.animation.expected.seconds=3
loading.animation.min.seconds=1.5
loading.animation.max.seconds=6

# --- Expected data ----------------------------------------------------------
# Kept here rather than inline so a change to the portal's data is a one-line edit.
expected.dream.count=10
expected.good.dreams=6
expected.bad.dreams=4
expected.total.dreams=10
expected.dreams.this.week=7
expected.recurring.dreams=2
expected.recurring.names=Flying over mountains,Lost in maze
expected.tabs.after.click=3

# --- Reporting --------------------------------------------------------------
extent.report.path=target/reports/ExtentReport.html
screenshot.dir=target/screenshots
screenshot.on.success=true

# Number of times a failed test is re-run. Set to 0 to disable retries entirely.
retry.count=1

# --- AI validation (Part 2, bonus) -----------------------------------------
# rule   - local keyword classifier, no API key needed (default, always runnable)
# gemini - Google Gemini        -> set GEMINI_API_KEY in .env
# groq   - Groq (open models)   -> set GROQ_API_KEY in .env
# openai - OpenAI               -> set OPENAI_API_KEY in .env
ai.provider=rule

# Leave blank to use each provider's default model.
ai.model=
ai.timeout.seconds=30
ai.max.attempts=3

# When a hosted provider is selected but its key is missing, fall back to the local
# classifier instead of failing the run. Set to false to make a missing key an error.
ai.fallback.to.rules=true

# The portal labels dreams by emotional tone, which is a judgement call a model is
# allowed to disagree with on a minority of entries. This is the share of the ten
# dreams that must match before the AI cross-check is considered a pass.
ai.minimum.agreement.ratio=0.7
